<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocuChat</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            color: #fff;
        }

        .container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            background-color: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
            z-index: 1;
        }

        h1 {
            margin-bottom: 20px;
            color: #00ffff;
            text-align: center;
        }

        .upload-section {
            margin-bottom: 20px;
            text-align: center;
        }

        .upload-label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
            color: #00ffff;
        }

        input[type="file"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #00ffff;
            border-radius: 4px;
            background-color: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        button {
            padding: 10px 15px;
            background-color: #00ffff;
            color: #000;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #009999;
        }

        #upload-message {
            color: green;
            margin-top: 10px;
        }

        .chat-container {
            height: 400px;
            display: flex;
            flex-direction: column;
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            border: 1px solid #00ffff;
        }

        #chat-messages {
            flex-grow: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .input-area {
            display: flex;
            padding: 10px;
            gap: 10px;
            border-top: 1px solid #00ffff;
            background-color: rgba(0, 0, 0, 0.3);
        }

        .input-area input {
            flex-grow: 1;
            padding: 10px;
            border: 1px solid #00ffff;
            border-radius: 4px;
            background-color: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .message {
            max-width: 80%;
            padding: 12px;
            border-radius: 8px;
            margin: 5px 0;
            word-wrap: break-word;
        }

        .user-message {
            background-color: #00ffff22;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .ai-message {
            background-color: #ffffff11;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        #loading {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            color: #00ffff;
            z-index: 2;
        }

        .loading-dots {
            display: flex;
            gap: 4px;
        }

        .loading-dots span {
            width: 8px;
            height: 8px;
            background-color: #00ffff;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
        .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        .upload-success {
            color: #00ffff;
            font-size: 1.2em;
            text-align: center;
            padding: 10px;
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .popup-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
            border: 2px solid #00ffff;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
            z-index: 1000;
            animation: fadeInOut 2s ease-in-out forwards;
        }

        @keyframes fadeInOut {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.9); }
            20% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            80% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(0.9); }
        }
    </style>
</head>
<body>
    <div id="threejs-container"></div>
    <div class="container">
        <h1>DocuChat</h1>
        <div class="upload-section">
            <label for="pdf-upload" class="upload-label">Upload PDF:</label>
            <input type="file" id="pdf-upload" accept="application/pdf">
            <button id="upload-button">Submit</button>
            <p id="upload-message"></p>
        </div>

        <div class="chat-container">
            <div id="chat-messages"></div>
            <div class="input-area">
                <input type="text" id="question-input" placeholder="Type your question here...">
                <button id="ask-button">Send</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('threejs-container').appendChild(renderer.domElement);

        const light = new THREE.PointLight(0xffffff, 1, 100);
        light.position.set(50, 50, 50);
        scene.add(light);

        const geometry = new THREE.TorusKnotGeometry(10, 3, 100, 16);
        const material = new THREE.MeshStandardMaterial({ color: 0x00ffff });
        const torusKnot = new THREE.Mesh(geometry, material);
        scene.add(torusKnot);

        camera.position.z = 30;

        function animate() {
            requestAnimationFrame(animate);
            torusKnot.rotation.x += 0.01;
            torusKnot.rotation.y += 0.01;
            renderer.render(scene, camera);
        }
        animate();

        function showLoading() {
            const chatMessages = document.getElementById('chat-messages');
            const loadingMessage = document.createElement('div');
            loadingMessage.className = 'message ai-message loading';
            loadingMessage.innerHTML = `
                <div class="loading-dots">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            `;
            loadingMessage.id = 'loading-message';
            chatMessages.appendChild(loadingMessage);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function hideLoading() {
            const loadingMessage = document.getElementById('loading-message');
            if (loadingMessage) {
                loadingMessage.remove();
            }
        }

        function showUploadLoading() {
            const uploadMessage = document.getElementById('upload-message');
            uploadMessage.innerHTML = `
                <div style="color: #00ffff; margin-bottom: 10px; font-size: 1.2em;">
                    Your PDF is being read by an AI<span style="font-size: 1.4em;">😎</span>
                </div>
                <div class="loading-dots" style="justify-content: center">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            `;
        }

        function hideUploadLoading() {
            const uploadMessage = document.getElementById('upload-message');
            uploadMessage.innerHTML = '';
        }

        document.getElementById('upload-button').addEventListener('click', function() {
            const fileInput = document.getElementById('pdf-upload');
            const file = fileInput.files[0];
            const formData = new FormData();

            if (!file) {
                alert("Please select a PDF to upload.");
                return;
            }

            showUploadLoading();
            formData.append('file', file);

            fetch('http://127.0.0.1:8000/upload/', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                // Create popup
                const popup = document.createElement('div');
                popup.className = 'popup-message';
                popup.innerHTML = `
                    <div style="font-size: 1.4em; text-align: center;">
                        You can now chat with your PDF<span style="font-size: 1.2em;">😊</span>
                    </div>
                `;
                document.body.appendChild(popup);

                // Remove popup after animation
                setTimeout(() => {
                    popup.remove();
                }, 2000);

                // Update upload message
                document.getElementById('upload-message').innerHTML = `
                    <div class="upload-success">
                        <span style="font-size: 1.4em;">🎉</span>
                        You can now ask any questions related to the Document!
                        <span style="font-size: 1.4em;">🤖</span>
                    </div>
                `;
                hideUploadLoading();
            })
            .catch(error => {
                document.getElementById('upload-message').textContent = "Error: " + error.message;
                document.getElementById('upload-message').style.color = 'red';
                hideUploadLoading();
            });
        });

        document.getElementById('ask-button').addEventListener('click', async function() {
            const questionInput = document.getElementById('question-input');
            const question = questionInput.value.trim();

            if (!question) {
                alert("Please enter a question.");
                return;
            }

            const chatMessages = document.getElementById('chat-messages');
            const userMessage = document.createElement('div');
            userMessage.className = 'message user-message';
            userMessage.textContent = question;
            chatMessages.appendChild(userMessage);

            questionInput.value = '';
            showLoading();

            try {
                const response = await fetch('http://127.0.0.1:8000/ask/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ question: question })
                });

                const data = await response.json();
                const aiMessage = document.createElement('div');
                aiMessage.className = 'message ai-message';
                aiMessage.textContent = data.answer;
                chatMessages.appendChild(aiMessage);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            } catch (error) {
                const aiMessage = document.createElement('div');
                aiMessage.className = 'message ai-message error';
                aiMessage.textContent = "Error: " + error.message;
                chatMessages.appendChild(aiMessage);
            } finally {
                hideLoading();
            }
        });

        document.getElementById('question-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('ask-button').click();
            }
        });
    </script>
</body>
</html>
